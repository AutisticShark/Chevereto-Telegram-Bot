[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chevereto-telegram-bot"
version = "2.0.0"
description = "A modern, asynchronous Telegram bot for Chevereto v4.x image and video hosting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "python-telegram-bot[webhooks]>=21.0,<23.0",
    "httpx>=0.27.0",
    "filetype>=1.2.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

