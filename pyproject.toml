[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chevereto-telegram-bot"
version = "2.0.0"
description = "A modern, asynchronous Telegram bot for Chevereto v4.x image and video hosting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "python-telegram-bot[webhooks]>=22.8,<23.0",
    "httpx>=0.28.1",
    "filetype>=1.2.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --asyncio-mode=auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

