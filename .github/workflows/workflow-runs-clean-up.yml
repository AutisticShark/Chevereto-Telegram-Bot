name: Delete old workflow runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-runs-cleanup
  cancel-in-progress: false

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete workflow runs older than seven days
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 0
